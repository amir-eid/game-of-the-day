name: Sports Data Pipeline
on:
  schedule:
    - cron: '15 10 * * *'
  workflow_dispatch:
jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install dbt-postgres

      - name: Create dbt profiles.yml
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          printf 'sports_transform:\n  target: dev\n  outputs:\n    dev:\n      type: postgres\n      host: aws-1-eu-central-1.pooler.supabase.com\n      user: postgres.agvurhyxkmhwjhohsbzb\n      password: "%s"\n      port: 5432\n      dbname: postgres\n      schema: public\n      threads: 1\n      search_path: public\n      sslmode: require\n' "$DB_PASSWORD" > sports_transform/profiles.yml

      - name: Run Pipeline
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python run_pipeline.py --oneshot
