name: Sports Data Pipeline

on:
  schedule:
    - cron: '15 9 * * *'
  workflow_dispatch: 

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install dbt-postgres

      - name: Create dbt profiles.yml
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          python - <<'PYEOF'
          import os
          password = os.environ['DB_PASSWORD']
          content = f"""sports_transform:
            target: dev
            outputs:
              dev:
                type: postgres
                host: aws-1-eu-central-1.pooler.supabase.com
                user: postgres.agvurhyxkmhwjhohsbzb
                password: "{password}"
                port: 5432
                dbname: postgres
                schema: public
                threads: 1
                search_path: public
                sslmode: require
          """
          with open('sports_transform/profiles.yml', 'w') as f:
              f.write(content)
          print("profiles.yml created successfully")
          PYEOF

      - name: Run dbt Transformations
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          cd sports_transform
          dbt run --target dev --profiles-dir .

      - name: Run Pipeline
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DBT_PROFILES_DIR: "sports_transform"
        run: python run_pipeline.py --oneshot