name: Sports Data Pipeline

on:
  schedule:
    - cron: '15 9 * * *'
  workflow_dispatch: 

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install dbt-postgres

      - name: Create dbt profiles.yml
  env:
    DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  run: |
    echo "sports_transform:" > sports_transform/profiles.yml
    echo "  target: dev" >> sports_transform/profiles.yml
    echo "  outputs:" >> sports_transform/profiles.yml
    echo "    dev:" >> sports_transform/profiles.yml
    echo "      type: postgres" >> sports_transform/profiles.yml
    echo "      host: aws-1-eu-central-1.pooler.supabase.com" >> sports_transform/profiles.yml
    echo "      user: postgres.agvurhyxkmhwjhohsbzb" >> sports_transform/profiles.yml
    echo "      password: \"$DB_PASSWORD\"" >> sports_transform/profiles.yml
    echo "      port: 5432" >> sports_transform/profiles.yml
    echo "      dbname: postgres" >> sports_transform/profiles.yml
    echo "      schema: public" >> sports_transform/profiles.yml
    echo "      threads: 1" >> sports_transform/profiles.yml
    echo "      search_path: public" >> sports_transform/profiles.yml
    echo "      sslmode: require" >> sports_transform/profiles.yml

      - name: Run dbt Transformations
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }} 
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          cd sports_transform
          dbt run --target dev --profiles-dir .

      - name: Run Pipeline
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DBT_PROFILES_DIR: "sports_transform"
        run: python run_pipeline.py --oneshot