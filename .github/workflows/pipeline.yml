name: Sports Data Pipeline

on:
  schedule:
    - cron: '30 10 * * *'
  workflow_dispatch: 

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install dbt-postgres
      - name: Run dbt Transformations
        env:
          # dbt needs these secrets to connect with Supabase
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }} 
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          cd sports_transform
          dbt run --target dev --profiles-dir .
      - name: Run Pipeline
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DBT_PROFILES_DIR: "sports_transform"
        run: python run_pipeline.py --oneshot
